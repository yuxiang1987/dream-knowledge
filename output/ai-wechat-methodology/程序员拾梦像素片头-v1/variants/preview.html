<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>程序员拾梦 · 右侧动效三款</title><style>body{margin:0;background:#eef3f8;color:#42556c;font:15px "Microsoft YaHei",sans-serif}main{max-width:1100px;margin:28px auto;padding:0 20px}h1{font-size:22px}h2{font-size:17px;margin:0}p{color:#7c8ba0;font-size:13px}article{background:white;border-radius:12px;padding:20px;margin:18px 0}img{display:block;width:100%;height:auto}nav{margin-top:12px}a,button{border:1px solid #d9e8f3;background:#f4faff;color:#328bc6;border-radius:7px;text-decoration:none;padding:6px 12px;margin-right:8px;font:13px "Microsoft YaHei",sans-serif;cursor:pointer}</style><main><h1>右侧动效 · 三款对比</h1><p>头像、文字、蓝色和6秒循环一致。原方块版保留。公众号后台与真机微信尚未验收。</p><article><h2>A · 代码窗口</h2><p>窗口展开，代码逐行刷出，光标闪动。</p><img src="code-window.gif" alt="代码窗口动画"><nav><a href="code-window.gif" download>GIF</a><a href="code-window.svg" download>SVG</a><button onclick="this.parentElement.previousElementSibling.src='code-window-still.png'">定帧</button><button onclick="this.parentElement.previousElementSibling.src='code-window.gif?'+Date.now()">重播</button></nav></article><article><h2>B · 文件夹与数据流</h2><p>像素文件从一个文件夹流向另一个文件夹。</p><img src="file-flow.gif" alt="文件夹与数据流动画"><nav><a href="file-flow.gif" download>GIF</a><a href="file-flow.svg" download>SVG</a><button onclick="this.parentElement.previousElementSibling.src='file-flow-still.png'">定帧</button><button onclick="this.parentElement.previousElementSibling.src='file-flow.gif?'+Date.now()">重播</button></nav></article><article><h2>C · 像素火花汇聚</h2><p>像素粒子环绕、聚拢，形成蓝色四芒火花。</p><img src="spark-orbit.gif" alt="像素火花汇聚动画"><nav><a href="spark-orbit.gif" download>GIF</a><a href="spark-orbit.svg" download>SVG</a><button onclick="this.parentElement.previousElementSibling.src='spark-orbit-still.png'">定帧</button><button onclick="this.parentElement.previousElementSibling.src='spark-orbit.gif?'+Date.now()">重播</button></nav></article><p><a href="../intro.gif">原版旋转方块</a></p></main></html>
